# Every pull request and every push to main: types, tests, build, and a look at what would be published.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.15 is the oldest Node the gateway supports; 24 is what releases are built with.
        node: ["22.15", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Validate release metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/release-identity.mjs
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && ! [[ "$PR_TITLE" =~ ^(feat|fix|perf|revert|docs|test|refactor|build|ci|chore|style)(\([a-zA-Z0-9._/-]+\))?!?:[[:space:]].+ ]]; then
              echo "::error::PR titles must use a Conventional Commit type so every merge creates a release."
              exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            BASE_VERSION="$(git show "$BASE_SHA:package.json" | jq -r .version)"
            if [[ "$PR_TITLE" == "chore(main): release "* || "$PR_BRANCH" == release-please--branches--main* || "$PR_LABELS" == *"autorelease: pending"* ]] || [ "$VERSION" != "$BASE_VERSION" ]; then
              set +e
              git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>/tmp/tag-error
              TAG_STATUS=$?
              set -e
              if [ "$TAG_STATUS" -eq 0 ]; then
                echo "::error::Release tag v$VERSION already exists."
                exit 1
              elif [ "$TAG_STATUS" -ne 2 ]; then
                cat /tmp/tag-error >&2
                echo "::error::Could not verify whether tag v$VERSION exists."
                exit 1
              fi
              if npm view "jev-advisor-gateway@$VERSION" version >/tmp/npm-version 2>/tmp/npm-error; then
                echo "::error::Release version $VERSION already exists on npm."
                exit 1
              elif ! grep -q 'E404' /tmp/npm-error; then
                cat /tmp/npm-error >&2
                echo "::error::Could not verify whether $VERSION exists on npm."
                exit 1
              fi
            fi
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
